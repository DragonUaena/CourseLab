[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "courselab"
version = "0.1.0"
description = "A multi-agent learning route planner built with CrewAI, FastAPI and Vue 3."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1",
    "crewai>=1.15.30,<2",
    "cryptography>=43",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "tavily-python>=0.8.5,<1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
courselab = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PTH", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

